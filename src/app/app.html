<app-icon-sprite />
<mat-sidenav-container class="app-shell">
	<mat-sidenav
		[opened]="isSidebarOpened"
		mode="side"
		class="app-shell__sidenav"
		role="navigation"
	>
		<app-app-sidebar />
	</mat-sidenav>

	<mat-sidenav-content class="app-shell__content-wrap">
		<app-app-header (menuToggle)="toggleSidebar()" />

		<main class="app-shell__main" role="main">
			<router-outlet />
		</main>
	</mat-sidenav-content>
</mat-sidenav-container>
