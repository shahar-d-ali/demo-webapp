<header class="app-header" role="banner">

		class="btn btn-icon btn-ghost"
		aria-label="Toggle sidebar"
		(click)="onMenuToggle()"
	>
		<svg viewBox="0 0 24 24" width="20" height="20"><use href="#i-menu"></use></svg>
	</button>

	<span class="app-header__spacer"></span>

	<button type="button" class="btn btn-icon btn-ghost" aria-label="User profile">
		<svg viewBox="0 0 24 24" width="20" height="20"><use href="#i-user"></use></svg>
	</button>
</header>
